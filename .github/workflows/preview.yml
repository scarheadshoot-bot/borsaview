
name: Preview screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      - run: npm install --no-save playwright@1.49.0

      - run: npx playwright install --with-deps chromium

      - name: Start site and take screenshot
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Website is ready"
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/next.log
            exit 1
          fi

          SITE_URL=http://127.0.0.1:3000 node scripts/shoot.mjs

      - name: Publish screenshots
        run: |
          mkdir -p /tmp/pv
          cp screenshots/*.png /tmp/pv/

          cd /tmp/pv

          git init -b previews
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com

          git add .
          git commit -m "Update previews"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git push -f origin previews
