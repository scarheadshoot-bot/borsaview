name: Preview screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/shoot.mjs
      - name: Publish screenshots
        run: |
          mkdir /tmp/pv
          cp shots/*.png /tmp/pv/
          cd /tmp/pv
          git init -b previews
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add .
          git commit -m previews
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin previews
